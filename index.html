<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#11182d">
  <title>English Test — Grade 6</title>
  <style>
    :root {
      --ink: #10182d;
      --muted: #65708a;
      --paper: #ffffff;
      --page: #eef3fa;
      --line: #dfe6f1;
      --violet: #6557e8;
      --blue: #2188ff;
      --cyan: #2ed6c7;
      --coral: #ff6f61;
      --yellow: #ffd45c;
      --good: #087f5b;
      --good-bg: #dff8ee;
      --bad: #c92a2a;
      --bad-bg: #fff0ef;
      --shadow: 0 18px 50px rgba(30, 45, 85, .10);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 4%, rgba(46, 214, 199, .16), transparent 22rem),
        radial-gradient(circle at 94% 14%, rgba(255, 111, 97, .14), transparent 24rem),
        var(--page);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }

    button, input, select { font: inherit; }
    button { border: 0; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 30;
      color: #fff;
      background: rgba(16, 24, 45, .96);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(255, 255, 255, .11);
    }

    .topbar-inner {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      font-weight: 850;
      letter-spacing: .02em;
    }

    .brand-mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      color: var(--ink);
      background: var(--yellow);
      transform: rotate(-4deg);
    }

    .progress-wrap { flex: 1; width: 100%; }
    .progress-copy {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
      color: #dce5ff;
      font-size: .78rem;
      font-weight: 750;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .progress-track {
      height: 7px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, .13);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--cyan), var(--yellow));
      transition: width .25s ease;
    }

    .hero {
      width: min(1160px, calc(100% - 32px));
      margin: 30px auto 20px;
      padding: 34px;
      position: relative;
      overflow: hidden;
      color: #fff;
      border-radius: 28px;
      background: linear-gradient(135deg, #11182d 0%, #26305a 62%, #6557e8 100%);
      box-shadow: var(--shadow);
    }

    .hero::before, .hero::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
    }
    .hero::before {
      width: 230px;
      height: 230px;
      right: -70px;
      top: -95px;
      border: 38px solid rgba(46, 214, 199, .23);
    }
    .hero::after {
      width: 110px;
      height: 110px;
      right: 170px;
      bottom: -70px;
      background: var(--coral);
      opacity: .83;
      transform: rotate(16deg);
      border-radius: 25px;
    }

    .eyebrow {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 11px;
      border-radius: 99px;
      color: var(--ink);
      background: var(--yellow);
      font-size: .76rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 16px 0 6px;
      max-width: 760px;
      font-size: clamp(2.15rem, 5vw, 4.8rem);
      line-height: .95;
      letter-spacing: -.055em;
    }

    .hero-sub {
      position: relative;
      z-index: 1;
      margin: 0;
      color: #d9e0f5;
      font-size: 1rem;
      font-weight: 600;
    }

    .student-data {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 12px;
      max-width: 620px;
      margin-top: 25px;
    }

    .student-data label {
      display: grid;
      gap: 6px;
      color: #cfd8f3;
      font-size: .75rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .student-data input {
      width: 100%;
      min-height: 45px;
      padding: 10px 13px;
      color: #fff;
      background: rgba(255, 255, 255, .1);
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 12px;
      outline: none;
    }

    .student-data input:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 4px rgba(46, 214, 199, .15);
    }

    .section-nav {
      width: min(1160px, calc(100% - 32px));
      margin: 14px auto 14px;
      display: flex;
      gap: 9px;
      overflow-x: auto;
      padding: 2px 2px 8px;
      scrollbar-width: thin;
    }

    .section-nav a {
      flex: 0 0 auto;
      padding: 9px 13px;
      color: var(--ink);
      background: rgba(255, 255, 255, .82);
      border: 1px solid var(--line);
      border-radius: 999px;
      font-size: .83rem;
      font-weight: 800;
      text-decoration: none;
    }
    .section-nav a:hover { border-color: var(--violet); color: var(--violet); }

    main {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto 130px;
    }

    .section-card {
      scroll-margin-top: 88px;
      margin: 0 0 22px;
      overflow: hidden;
      background: var(--paper);
      border: 1px solid rgba(207, 216, 234, .9);
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(30, 45, 85, .07);
    }

    .section-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 22px 24px;
      background: linear-gradient(90deg, #f7f9ff, #fff);
      border-bottom: 1px solid var(--line);
    }

    .section-letter {
      flex: 0 0 45px;
      width: 45px;
      height: 45px;
      display: grid;
      place-items: center;
      color: #fff;
      background: var(--violet);
      border-radius: 14px;
      font-size: 1.25rem;
      font-weight: 900;
      transform: rotate(-3deg);
    }

    .section-card:nth-of-type(4n + 2) .section-letter { background: var(--blue); transform: rotate(3deg); }
    .section-card:nth-of-type(4n + 3) .section-letter { background: var(--coral); }
    .section-card:nth-of-type(4n + 4) .section-letter { color: var(--ink); background: var(--cyan); transform: rotate(3deg); }

    .section-head h2 {
      margin: 0;
      font-size: clamp(1.12rem, 2vw, 1.45rem);
      line-height: 1.2;
    }

    .section-head p {
      margin: 3px 0 0;
      color: var(--muted);
      font-size: .91rem;
    }

    .section-body { padding: 24px; }

    .word-bank, .opposite-bank {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 20px;
      padding: 14px;
      color: #3c348f;
      background: #f0efff;
      border: 1px dashed #a9a1f4;
      border-radius: 15px;
      font-weight: 780;
    }

    .word-bank span, .opposite-bank span {
      padding: 5px 9px;
      background: #fff;
      border-radius: 8px;
    }

    /* Drag & drop task (Section E) */
    .word-bank.drag-bank span {
      cursor: grab;
      user-select: none;
      border: 1px solid transparent;
      transition: transform .15s ease, opacity .15s ease, border-color .15s ease;
    }
    .word-bank.drag-bank span:hover { transform: translateY(-1px); border-color: #8f86ef; }
    .word-bank.drag-bank span:active { cursor: grabbing; }
    .word-bank.drag-bank span.used { opacity: .32; }
    .word-bank.drag-bank.drag-over { outline: 3px solid rgba(101, 87, 232, .20); }

    .drop-zone {
      min-width: 150px;
      min-height: 43px;
      padding: 7px 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed #aaa4de;
      border-radius: 11px;
      background: #fff;
      color: #7b7697;
      font-weight: 800;
      cursor: pointer;
      transition: .15s ease;
    }
    .drop-zone::before { content: "Drop word here"; font-size: .82rem; }
    .drop-zone.has-value {
      border-style: solid;
      border-color: var(--violet);
      background: #efedff;
      color: #4139a0;
    }
    .drop-zone.has-value::before { content: none; }
    .drop-zone.drag-over {
      border-color: var(--cyan);
      background: #eafffb;
      transform: scale(1.015);
    }
    .dropped-word {
      cursor: grab;
      user-select: none;
    }
    .dropped-word:active { cursor: grabbing; }
    .drag-hint {
      margin-left: 8px;
      color: var(--muted);
      font-size: .78rem;
      font-weight: 650;
    }

    .questions { display: grid; gap: 11px; }

    .question {
      padding: 15px 16px;
      background: #fbfcff;
      border: 1px solid var(--line);
      border-radius: 16px;
      transition: border-color .18s ease, box-shadow .18s ease, background .18s ease;
    }

    .question:focus-within {
      border-color: #9d96ef;
      box-shadow: 0 0 0 4px rgba(101, 87, 232, .08);
    }

    .question-line {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      font-size: 1rem;
      font-weight: 650;
    }

    .q-number {
      flex: 0 0 31px;
      width: 31px;
      height: 31px;
      display: grid;
      place-items: center;
      color: var(--violet);
      background: #eceaff;
      border-radius: 9px;
      font-size: .82rem;
      font-weight: 900;
    }

    .prompt { flex: 1; min-width: 0; }
    .dialogue b { color: var(--violet); }

    .answer-area {
      margin: 11px 0 0 42px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .option {
      position: relative;
      display: flex;
      align-items: center;
      gap: 9px;
      min-height: 43px;
      padding: 9px 13px;
      cursor: pointer;
      color: #28324c;
      background: #fff;
      border: 1px solid #cfd8e8;
      border-radius: 12px;
      font-weight: 700;
      transition: .16s ease;
    }
    .option:hover { border-color: var(--violet); transform: translateY(-1px); }
    .option:has(input:checked) { color: #4139a0; background: #efedff; border-color: var(--violet); }
    .option input { accent-color: var(--violet); width: 17px; height: 17px; }

    select, .text-answer {
      min-height: 43px;
      padding: 9px 12px;
      color: var(--ink);
      background: #fff;
      border: 1px solid #c9d3e4;
      border-radius: 11px;
      outline: none;
    }
    select:focus, .text-answer:focus { border-color: var(--violet); box-shadow: 0 0 0 3px rgba(101, 87, 232, .1); }
    .text-answer { width: min(250px, 100%); }

    .feedback {
      display: none;
      margin: 9px 0 0 42px;
      font-size: .86rem;
      font-weight: 800;
    }

    .question.correct { background: var(--good-bg); border-color: #87d9bd; }
    .question.correct .feedback { display: block; color: var(--good); }
    .question.incorrect { background: var(--bad-bg); border-color: #f2aaa3; }
    .question.incorrect .feedback { display: block; color: var(--bad); }

    .reading {
      margin: 0 0 20px;
      padding: 22px;
      color: #29334b;
      background: #f5f8fc;
      border-left: 6px solid var(--cyan);
      border-radius: 16px;
      white-space: pre-line;
    }

    .action-dock {
      position: fixed;
      z-index: 35;
      left: 50%;
      bottom: 18px;
      width: min(720px, calc(100% - 28px));
      padding: 10px;
      display: flex;
      gap: 10px;
      background: rgba(16, 24, 45, .94);
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 18px;
      box-shadow: 0 18px 50px rgba(16, 24, 45, .28);
      backdrop-filter: blur(15px);
      transform: translateX(-50%);
    }

    .btn {
      min-height: 48px;
      padding: 12px 18px;
      cursor: pointer;
      border-radius: 12px;
      font-weight: 850;
      transition: transform .16s ease, filter .16s ease;
    }
    .btn:hover { transform: translateY(-1px); filter: brightness(1.04); }
    .btn-primary { flex: 1; color: var(--ink); background: linear-gradient(90deg, var(--cyan), var(--yellow)); }
    .btn-secondary { color: #fff; background: #2a3558; }

    .result-box {
      display: none;
      margin: 0 0 22px;
      padding: 25px;
      color: #fff;
      background: linear-gradient(135deg, #11182d, #3b347f);
      border-radius: 23px;
      box-shadow: var(--shadow);
      text-align: center;
    }
    .result-box.show { display: block; }
    .result-label { color: #cad4f2; font-weight: 750; text-transform: uppercase; letter-spacing: .12em; font-size: .78rem; }
    .result-score { margin: 5px 0; font-size: clamp(2.7rem, 8vw, 5.6rem); font-weight: 950; letter-spacing: -.06em; }
    .result-message { margin: 0; color: #eef2ff; font-size: 1.05rem; font-weight: 650; }


    /* One task at a time */
    .hero { margin-bottom: 14px; padding: 22px 28px; }
    .hero h1 { font-size: clamp(1.9rem, 4vw, 3.3rem); margin: 10px 0 4px; }
    .student-data { margin-top: 16px; }
    .section-nav { margin-bottom: 14px; }
    main { margin-bottom: 100px; }
    .section-card { display: none; margin-bottom: 0; }
    .section-card.active { display: block; }
    .section-head { padding: 16px 20px; }
    .section-body { padding: 18px 20px; }
    .questions { gap: 8px; }
    .question { padding: 11px 13px; }
    .answer-area { margin-top: 7px; }
    .section-nav a.active { color: #fff; background: var(--violet); border-color: var(--violet); }

    @media (min-width: 721px) {
      body { overflow-y: hidden; }

      /* The task header stays visible while the questions scroll. */
      .section-card.active {
        max-height: calc(100vh - 190px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .section-card.active .section-head {
        position: sticky;
        top: 0;
        z-index: 12;
        background: linear-gradient(90deg, #f7f9ff 0%, #ffffff 82%);
        box-shadow: 0 8px 18px rgba(30, 45, 85, .06);
      }

      /* A and E: keep the word bank visible while the learner scrolls. */
      .section-card.has-bank .word-bank,
      .section-card.has-bank .opposite-bank {
        position: sticky;
        top: 78px;
        z-index: 10;
        margin-bottom: 14px;
        box-shadow: 0 8px 20px rgba(70, 62, 160, .10);
      }

      /* H: keep the reading text visible next to the scrolling questions. */
      .section-card.has-reading .section-body {
        display: grid;
        grid-template-columns: minmax(360px, .9fr) minmax(0, 1.1fr);
        gap: 18px;
        align-items: start;
      }

      .section-card.has-reading .reading {
        position: sticky;
        top: 82px;
        margin: 0;
        max-height: calc(100vh - 300px);
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .section-card.has-reading .questions {
        min-width: 0;
      }

      .action-dock { bottom: 12px; }
    }

    @media (max-width: 720px) {
      .topbar-inner { width: min(100% - 20px, 1160px); gap: 12px; }
      .brand span:last-child { display: none; }
      .section-nav, main { width: min(100% - 20px, 1160px); }
      .hero { margin-top: 16px; padding: 24px 20px; border-radius: 22px; }
      .student-data { grid-template-columns: 1fr; }
      .section-head, .section-body { padding: 18px 15px; }
      .question { padding: 13px 12px; }
      .answer-area, .feedback { margin-left: 0; }
      .option { width: 100%; }
      .action-dock { bottom: 10px; }
      .btn { padding-inline: 13px; }
    }

    @media print {
      body { background: #fff; }
      .topbar, .section-nav, .action-dock { display: none !important; }
      .section-card { box-shadow: none; break-inside: avoid; }
      main { margin-bottom: 0; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div class="progress-wrap" aria-label="Test progress">
        <div class="progress-copy"><span>Your progress</span><span id="progressText">0 / 52 answered</span></div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>
    </div>
  </div>

  <nav class="section-nav" id="sectionNav" aria-label="Test sections"></nav>

  <main>
    <div class="result-box" id="resultBox" tabindex="-1">
      <div class="result-label">Your result</div>
      <div class="result-score" id="resultScore">0 / 52</div>
      <p class="result-message" id="resultMessage"></p>
    </div>
    <form id="quizForm" novalidate></form>
  </main>

  <div class="action-dock">
    <button class="btn btn-secondary" type="button" id="resetButton">Try again</button>
    <button class="btn btn-primary" type="button" id="checkButton">Check answers</button>
  </div>

  <script>
    const sections = [
      {
        letter: "A",
        title: "Match the opposites",
        instruction: "Choose the correct letter for each word.",
        bank: ["A · short", "B · young", "C · slim", "D · small", "E · wavy"],
        bankClass: "opposite-bank",
        items: [
          { id: 1, type: "select", prompt: "big", options: ["A", "B", "C", "D", "E"], answer: "D" },
          { id: 2, type: "select", prompt: "straight", options: ["A", "B", "C", "D", "E"], answer: "E" },
          { id: 3, type: "select", prompt: "fat", options: ["A", "B", "C", "D", "E"], answer: "C" },
          { id: 4, type: "select", prompt: "tall", options: ["A", "B", "C", "D", "E"], answer: "A" },
          { id: 5, type: "select", prompt: "old", options: ["A", "B", "C", "D", "E"], answer: "B" }
        ]
      },
      {
        letter: "B",
        title: "Choose the correct word",
        instruction: "Select the option that completes each sentence.",
        items: [
          { id: 6, type: "choice", prompt: "Julie is Phillip and Karen’s mum. She’s ___ mum.", options: ["your", "their"], answer: "their" },
          { id: 7, type: "choice", prompt: "Bob is Jill’s husband. He’s ___ husband.", options: ["her", "his"], answer: "her" },
          { id: 8, type: "choice", prompt: "My grandma is old. She’s in ___ seventies.", options: ["our", "her"], answer: "her" },
          { id: 9, type: "choice", prompt: "Kim and I are twins. She is ___ sister.", options: ["my", "her"], answer: "my" },
          { id: 10, type: "choice", prompt: "My family all live here. This is ___ house.", options: ["our", "your"], answer: "our" }
        ]
      },
      {
        letter: "C",
        title: "Choose the correct response",
        instruction: "Read each mini-dialogue and select a or b.",
        items: [
          { id: 11, type: "choice", prompt: "<span class='dialogue'><b>A:</b> What’s your nationality?</span>", options: ["a · England.", "b · British."], answer: "b · British." },
          { id: 12, type: "choice", prompt: "<span class='dialogue'><b>A:</b> Here’s your new card.</span>", options: ["a · Thank you very much.", "b · Can I help you?"], answer: "a · Thank you very much." },
          { id: 13, type: "choice", prompt: "<span class='dialogue'><b>A:</b> Whose camera is this?</span>", options: ["a · It’s Tim’s.", "b · It’s Tim."], answer: "a · It’s Tim’s." },
          { id: 14, type: "choice", prompt: "<span class='dialogue'><b>A:</b> What’s your telephone number?</span>", options: ["a · 135 Park Street.", "b · 020 711 2244."], answer: "b · 020 711 2244." },
          { id: 15, type: "choice", prompt: "<span class='dialogue'><b>A:</b> How can I help you?</span>", options: ["a · I’d like to join your video club, please.", "b · That’s fine."], answer: "a · I’d like to join your video club, please." }
        ]
      },
      {
        letter: "D",
        title: "Choose the correct item",
        instruction: "Select A or B.",
        items: [
          { id: 16, type: "choice", prompt: "That is ___ computer.", options: ["A · his", "B · mine"], answer: "A · his" },
          { id: 17, type: "choice", prompt: "Take your ___ card with you.", options: ["A · licence", "B · membership"], answer: "B · membership" },
          { id: 18, type: "choice", prompt: "What’s your home ___?", options: ["A · address", "B · name"], answer: "A · address" },
          { id: 19, type: "choice", prompt: "Give the camera back to Sue. It’s ___.", options: ["A · theirs", "B · hers"], answer: "B · hers" },
          { id: 20, type: "choice", prompt: "What is the expiry ___ on your credit card?", options: ["A · date", "B · postcode"], answer: "A · date" }
        ]
      },
      {
        letter: "E",
        title: "Complete with the correct word",
        instruction: "Drag the words from the bank into the correct gaps. One word is extra.",
        bank: ["capital", "twins", "late", "north", "deserts", "slim", "credit", "nationality", "wavy", "driving", "middle"],
        bankClass: "word-bank",
        items: [
          { id: 21, type: "drag", prompt: "Has Bill got a ___ licence?", answer: "driving" },
          { id: 22, type: "drag", prompt: "My grandparents are in their ___ fifties.", answer: "late" },
          { id: 23, type: "drag", prompt: "Madrid is the ___ city of Spain.", answer: "capital" },
          { id: 24, type: "drag", prompt: "Paul has got two brothers. They are ___.", answer: "twins" },
          { id: 25, type: "drag", prompt: "Her father is a ___-aged man.", answer: "middle" },
          { id: 26, type: "drag", prompt: "Milan is in the ___ of Italy.", answer: "north" },
          { id: 27, type: "drag", prompt: "Lisa is tall and ___ with long, dark hair.", answer: "slim" },
          { id: 28, type: "drag", prompt: "‘What ___ is she?’ — ‘She’s French.’", answer: "nationality" },
          { id: 29, type: "drag", prompt: "In Africa there are a lot of ___.", answer: "deserts" },
          { id: 30, type: "drag", prompt: "Sally’s hair is short and ___.", answer: "wavy" }
        ]
      },
      {
        letter: "F",
        title: "Choose the correct pronoun",
        instruction: "Choose the form that makes the sentence correct.",
        items: [
          { id: 31, type: "choice", prompt: "Mark has got a new flat. ___ flat is spacious.", options: ["His", "Our"], answer: "His" },
          { id: 32, type: "choice", prompt: "Is Ruth ___ sister?", options: ["yours", "your"], answer: "your" },
          { id: 33, type: "choice", prompt: "This camera isn’t ___.", options: ["mine", "my"], answer: "mine" },
          { id: 34, type: "choice", prompt: "This little puppy isn’t ___.", options: ["our", "ours"], answer: "ours" },
          { id: 35, type: "choice", prompt: "Tina and Susan are ___ friends.", options: ["my", "mine"], answer: "my" },
          { id: 36, type: "choice", prompt: "What’s ___ phone number?", options: ["yours", "her"], answer: "her" },
          { id: 37, type: "choice", prompt: "Is this skateboard ___?", options: ["his", "her"], answer: "his" },
          { id: 38, type: "choice", prompt: "___ house is very modern.", options: ["Their", "Theirs"], answer: "Their" },
          { id: 39, type: "choice", prompt: "Are these books ___?", options: ["her", "hers"], answer: "hers" },
          { id: 40, type: "choice", prompt: "What is ___ address?", options: ["his", "hers"], answer: "his" }
        ]
      },
      {
        letter: "G",
        title: "Choose the correct possessive form",
        instruction: "Pay attention to possessive pronouns and apostrophes.",
        items: [
          { id: 41, type: "choice", prompt: "Whose camera is this? It’s ___.", options: ["her", "hers"], answer: "hers" },
          { id: 42, type: "choice", prompt: "Mike is ___ son.", options: ["Peter’s and Sue’s", "Peter and Sue’s"], answer: "Peter and Sue’s" },
          { id: 43, type: "choice", prompt: "This football isn’t mine. It’s my ___.", options: ["cousin’s", "cousins"], answer: "cousin’s" },
          { id: 44, type: "choice", prompt: "Is this ___ card?", options: ["Roses’", "Rose’s"], answer: "Rose’s" },
          { id: 45, type: "choice", prompt: "These are ___ pencils.", options: ["Emily’s", "Emilys"], answer: "Emily’s" }
        ]
      },
      {
        letter: "H",
        title: "Reading comprehension",
        instruction: "Read Daniel’s message and choose the correct answer.",
        reading: `Hi, John!

How are you? This is my family. My parents’ names are Emily and Peter. My dad is tall with short, straight hair. He’s in his mid-forties. My mum is tall and slim. Her hair is short and curly. She’s in her late thirties. My sister Karen is eight years old. She has got long, dark hair and a small nose. My brother Mark is nine years old. He has got short, fair hair, big green eyes and a big nose.

Well, that’s all about my family. Please write soon and tell me about your family. Send me a picture if you can.

Bye for now,
Daniel`,
        items: [
          { id: 46, type: "choice", prompt: "There are ___ people in Daniel’s family.", options: ["four", "five"], answer: "five" },
          { id: 47, type: "choice", prompt: "___ is Daniel’s dad.", options: ["Peter", "Mark"], answer: "Peter" },
          { id: 48, type: "choice", prompt: "Emily is Daniel’s ___.", options: ["sister", "mum"], answer: "mum" },
          { id: 49, type: "choice", prompt: "Mark has ___, fair hair.", options: ["long", "short"], answer: "short" },
          { id: 50, type: "choice", prompt: "Daniel’s mum is tall and ___.", options: ["slim", "fat"], answer: "slim" },
          { id: 51, type: "choice", prompt: "Karen is ___ years old.", options: ["9", "8"], answer: "8" },
          { id: 52, type: "choice", prompt: "Mark has big, ___ eyes.", options: ["green", "blue"], answer: "green" }
        ]
      }
    ];

    const quizForm = document.getElementById("quizForm");
    const sectionNav = document.getElementById("sectionNav");
    const resultBox = document.getElementById("resultBox");
    const totalQuestions = sections.reduce((sum, section) => sum + section.items.length, 0);

    const safeAttr = value => encodeURIComponent(value);
    const clean = value => String(value ?? "")
      .trim()
      .toLowerCase()
      .replace(/[‘’]/g, "'")
      .replace(/\s+/g, " ");

    function renderAnswer(item) {
      if (item.type === "text") {
        return `<input class="text-answer answer-control" type="text" autocomplete="off" placeholder="Type one word" aria-label="Answer ${item.id}">`;
      }

      if (item.type === "drag") {
        return `<div class="drop-zone answer-control" data-value="" data-question-id="${item.id}" role="button" tabindex="0" aria-label="Drop answer for question ${item.id}"></div>`;
      }

      if (item.type === "select") {
        return `<select class="answer-control" aria-label="Answer ${item.id}">
          <option value="">Choose a letter</option>
          ${item.options.map(option => `<option value="${safeAttr(option)}">${option}</option>`).join("")}
        </select>`;
      }

      return item.options.map(option => `
        <label class="option">
          <input class="answer-control" type="radio" name="q${item.id}" value="${safeAttr(option)}">
          <span>${option}</span>
        </label>`).join("");
    }

    function renderQuestion(item, localIndex) {
      return `
        <article class="question" data-id="${item.id}" data-answer="${safeAttr(item.answer)}">
          <div class="question-line">
            <span class="q-number">${localIndex + 1}</span>
            <div class="prompt">${item.prompt}</div>
          </div>
          <div class="answer-area">${renderAnswer(item)}</div>
          <div class="feedback" role="status"></div>
        </article>`;
    }

    function renderTest() {
      quizForm.innerHTML = sections.map(section => `
        <section class="section-card${section.bank ? " has-bank" : ""}${section.reading ? " has-reading" : ""}" id="section-${section.letter}">
          <div class="section-head">
            <span class="section-letter">${section.letter}</span>
            <div><h2>${section.title}</h2><p>${section.instruction}</p></div>
          </div>
          <div class="section-body">
            ${section.bank ? `<div class="${section.bankClass}${section.letter === "E" ? " drag-bank" : ""}" ${section.letter === "E" ? 'data-drag-bank="true"' : ''}>${section.bank.map(word => section.letter === "E" ? `<span draggable="true" data-word="${word}">${word}</span>` : `<span>${word}</span>`).join("")}</div>` : ""}
            ${section.reading ? `<div class="reading">${section.reading}</div>` : ""}
            <div class="questions">${section.items.map((item, index) => renderQuestion(item, index)).join("")}</div>
          </div>
        </section>`).join("");

      sectionNav.innerHTML = sections.map(section =>
        `<a href="#" data-section="section-${section.letter}">${section.letter} · ${section.title}</a>`
      ).join("");

      const firstSection = document.getElementById(`section-${sections[0].letter}`);
      const firstLink = sectionNav.querySelector("a");
      if (firstSection) firstSection.classList.add("active");
      if (firstLink) firstLink.classList.add("active");

      sectionNav.querySelectorAll("a").forEach(link => {
        link.addEventListener("click", event => {
          event.preventDefault();
          const targetId = link.dataset.section;
          document.querySelectorAll(".section-card").forEach(card => card.classList.remove("active"));
          sectionNav.querySelectorAll("a").forEach(a => a.classList.remove("active"));
          document.getElementById(targetId)?.classList.add("active");
          link.classList.add("active");
          resultBox.classList.remove("show");
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      });
    }

    function getResponse(question) {
      const dropZone = question.querySelector('.drop-zone');
      if (dropZone) return dropZone.dataset.value || "";

      const textInput = question.querySelector('input[type="text"]');
      if (textInput) return textInput.value;

      const select = question.querySelector("select");
      if (select) return select.value ? decodeURIComponent(select.value) : "";

      const radio = question.querySelector('input[type="radio"]:checked');
      return radio ? decodeURIComponent(radio.value) : "";
    }

    let selectedDragWord = "";

    function refreshDragBank() {
      const bank = document.querySelector('[data-drag-bank="true"]');
      if (!bank) return;
      const used = new Set([...document.querySelectorAll('#section-E .drop-zone')].map(z => z.dataset.value).filter(Boolean));
      bank.querySelectorAll('[data-word]').forEach(chip => {
        chip.classList.toggle('used', used.has(chip.dataset.word));
        chip.setAttribute('aria-disabled', used.has(chip.dataset.word) ? 'true' : 'false');
      });
    }

    function setDropValue(zone, word) {
      if (!zone) return;
      // Each bank word can be used only once. Moving it clears its previous position.
      if (word) {
        document.querySelectorAll('#section-E .drop-zone').forEach(other => {
          if (other !== zone && other.dataset.value === word) setDropValue(other, "");
        });
      }
      zone.dataset.value = word || "";
      zone.classList.toggle('has-value', Boolean(word));
      zone.innerHTML = word ? `<span class="dropped-word" draggable="true" data-word="${word}">${word}</span>` : "";
      const question = zone.closest('.question');
      if (question) question.classList.remove('correct', 'incorrect');
      const feedback = question?.querySelector('.feedback');
      if (feedback) feedback.textContent = "";
      refreshDragBank();
      updateProgress();
    }

    function initDragDrop() {
      const sectionE = document.getElementById('section-E');
      if (!sectionE) return;
      const bank = sectionE.querySelector('[data-drag-bank="true"]');
      if (!bank) return;

      bank.querySelectorAll('[data-word]').forEach(chip => {
        chip.addEventListener('dragstart', e => {
          if (chip.classList.contains('used')) { e.preventDefault(); return; }
          e.dataTransfer.setData('text/plain', chip.dataset.word);
          e.dataTransfer.effectAllowed = 'move';
        });
        // Click/tap fallback: choose a word, then click a gap.
        chip.addEventListener('click', () => {
          if (!chip.classList.contains('used')) selectedDragWord = chip.dataset.word;
        });
      });

      sectionE.querySelectorAll('.drop-zone').forEach(zone => {
        zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); e.dataTransfer.dropEffect = 'move'; });
        zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
        zone.addEventListener('drop', e => {
          e.preventDefault();
          zone.classList.remove('drag-over');
          const word = e.dataTransfer.getData('text/plain');
          if (word) setDropValue(zone, word);
        });
        zone.addEventListener('click', e => {
          if (e.target.classList.contains('dropped-word')) {
            setDropValue(zone, "");
            return;
          }
          if (selectedDragWord) {
            setDropValue(zone, selectedDragWord);
            selectedDragWord = "";
          }
        });
        zone.addEventListener('keydown', e => {
          if ((e.key === 'Enter' || e.key === ' ') && selectedDragWord) {
            e.preventDefault();
            setDropValue(zone, selectedDragWord);
            selectedDragWord = "";
          }
        });
        zone.addEventListener('dragstart', e => {
          const chip = e.target.closest('.dropped-word');
          if (!chip) return;
          e.dataTransfer.setData('text/plain', chip.dataset.word);
          e.dataTransfer.effectAllowed = 'move';
          // Clear only after drag begins; dropping elsewhere will place it there.
          setTimeout(() => setDropValue(zone, ""), 0);
        });
      });

      // Drag an assigned word back to the bank to remove it.
      bank.addEventListener('dragover', e => { e.preventDefault(); bank.classList.add('drag-over'); e.dataTransfer.dropEffect = 'move'; });
      bank.addEventListener('dragleave', () => bank.classList.remove('drag-over'));
      bank.addEventListener('drop', e => {
        e.preventDefault();
        bank.classList.remove('drag-over');
        const word = e.dataTransfer.getData('text/plain');
        if (!word) return;
        sectionE.querySelectorAll('.drop-zone').forEach(zone => {
          if (zone.dataset.value === word) setDropValue(zone, "");
        });
      });

      refreshDragBank();
    }

    function updateProgress() {
      const questions = [...document.querySelectorAll(".question")];
      const answered = questions.filter(question => clean(getResponse(question)) !== "").length;
      document.getElementById("progressText").textContent = `${answered} / ${totalQuestions} answered`;
      document.getElementById("progressBar").style.width = `${(answered / totalQuestions) * 100}%`;
    }

    function checkAnswers() {
      let score = 0;

      document.querySelectorAll(".question").forEach(question => {
        const correctAnswer = decodeURIComponent(question.dataset.answer);
        const response = getResponse(question);
        const isCorrect = clean(response) === clean(correctAnswer);
        const feedback = question.querySelector(".feedback");

        question.classList.remove("correct", "incorrect");
        question.classList.add(isCorrect ? "correct" : "incorrect");

        if (isCorrect) {
          score += 1;
          feedback.textContent = "Correct!";
        } else if (!clean(response)) {
          feedback.textContent = `Not answered. Correct answer: ${correctAnswer}`;
        } else {
          feedback.textContent = `Correct answer: ${correctAnswer}`;
        }
      });

      const percentage = Math.round((score / totalQuestions) * 100);
      let message = "Keep practising — you can improve this result.";
      if (percentage >= 85) message = "Excellent work — you know the material very well!";
      else if (percentage >= 70) message = "Good job — just revise a few points.";
      else if (percentage >= 50) message = "Nice effort — review the highlighted answers and try again.";

      document.getElementById("resultScore").textContent = `${score} / ${totalQuestions}`;
      document.getElementById("resultMessage").textContent = `${percentage}% · ${message}`;
      resultBox.classList.add("show");
      resultBox.focus({ preventScroll: true });
      resultBox.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetTest() {
      quizForm.reset();
      document.querySelectorAll(".question").forEach(question => {
        question.classList.remove("correct", "incorrect");
        question.querySelector(".feedback").textContent = "";
      });
      document.querySelectorAll('#section-E .drop-zone').forEach(zone => {
        zone.dataset.value = "";
        zone.classList.remove('has-value', 'drag-over');
        zone.innerHTML = "";
      });
      selectedDragWord = "";
      refreshDragBank();
      resultBox.classList.remove("show");
      document.querySelectorAll(".section-card").forEach(card => card.classList.remove("active"));
      sectionNav.querySelectorAll("a").forEach(a => a.classList.remove("active"));
      document.getElementById(`section-${sections[0].letter}`)?.classList.add("active");
      sectionNav.querySelector("a")?.classList.add("active");
      updateProgress();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    renderTest();
    initDragDrop();
    quizForm.addEventListener("input", updateProgress);
    quizForm.addEventListener("change", updateProgress);
    document.getElementById("checkButton").addEventListener("click", checkAnswers);
    document.getElementById("resetButton").addEventListener("click", resetTest);
    updateProgress();
  </script>
</body>
</html>
